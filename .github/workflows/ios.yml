name: iOS Simulator App

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios.yml'

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Create iOS project
        run: npx cap add ios
      - name: Sync Capacitor iOS
        run: npx cap sync ios
      - name: Add Apple privacy manifest
        run: |
          cat > ios/App/App/PrivacyInfo.xcprivacy <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>NSPrivacyAccessedAPITypes</key>
            <array>
              <dict>
                <key>NSPrivacyAccessedAPIType</key>
                <string>NSPrivacyAccessedAPICategoryFileTimestamp</string>
                <key>NSPrivacyAccessedAPITypeReasons</key>
                <array><string>C617.1</string></array>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST
      - name: Build iOS Simulator app (no signing required)
        run: |
          set -e
          mkdir -p build/ios-simulator
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$PWD/build/ios-simulator" build
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$PWD/build/ios-simulator" build
          fi
      - name: Package simulator app
        run: |
          cd build/ios-simulator
          zip -qry ../../RJP-PDF-Editor-iOS-Simulator.zip App.app
      - uses: actions/upload-artifact@v4
        with:
          name: RJP-PDF-Editor-iOS-Simulator
          path: RJP-PDF-Editor-iOS-Simulator.zip
          if-no-files-found: error
