name: Build RJP Signer Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reset npm
        run: |
          npm install -g npm@10.9.2
          npm cache clean --force
          rm -rf node_modules package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps --no-package-lock

      - name: Test
        run: npm test

      - name: Build WebApp
        run: npm run build

      - name: Validate Capacitor config
        shell: bash
        run: |
          set -e
          echo "Repository root: $(pwd)"
          test -f capacitor.config.json || { echo "ERROR: capacitor.config.json missing from repository root"; exit 1; }
          cat capacitor.config.json
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          if (c.appId !== 'pt.rjp.signer') {
            console.error('ERROR: invalid or missing appId:', c.appId);
            process.exit(1);
          }
          if (c.appName !== 'RJP Signer') {
            console.error('ERROR: invalid or missing appName:', c.appName);
            process.exit(1);
          }
          if (c.webDir !== 'dist') {
            console.error('ERROR: invalid or missing webDir:', c.webDir);
            process.exit(1);
          }
          console.log('Capacitor config OK:', c.appId, c.appName, c.webDir);
          NODE
          test -d dist || { echo "ERROR: dist directory missing after Vite build"; exit 1; }

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Add Android platform if missing
        shell: bash
        run: |
          set -e
          if [ ! -d android ]; then
            echo "Creating Android platform for pt.rjp.signer"
            npx cap add android
          else
            echo "Android platform already exists"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Read project version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RJP-Signer-V${{ steps.meta.outputs.version }}-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
