name: Build RJP Signer Windows App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - 'bridge/**'
      - '.github/workflows/build-windows-app.yml'

permissions:
  contents: read

jobs:
  build-windows-app:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install web/desktop dependencies
        shell: pwsh
        run: npm install

      - name: Run smoke tests
        shell: pwsh
        run: npm test

      - name: Build Web UI
        shell: pwsh
        run: npm run build

      - name: Build Bridge Release x64
        shell: pwsh
        run: msbuild bridge/RJP.Signer.Bridge/RJP.Signer.Bridge.csproj /restore /t:Build /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Build Windows desktop setup
        shell: pwsh
        run: npm run windows:package

      - name: Read project version
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          $source = "release-windows/win-unpacked/*"
          $dest = "release-windows/RJP_Signer_Windows_Portable_${version}_x64.zip"
          if (!(Test-Path "release-windows/win-unpacked")) { throw "win-unpacked não foi criado" }
          Compress-Archive -Path $source -DestinationPath $dest -Force

      - name: Upload Windows App
        uses: actions/upload-artifact@v4
        with:
          name: RJP-Signer-Windows-App-V${{ steps.meta.outputs.version }}
          path: |
            release-windows/RJP_Signer_Windows_Setup_*.exe
            release-windows/RJP_Signer_Windows_Portable_*.zip
          if-no-files-found: error
